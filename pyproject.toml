[project]
name = "mcp-lunch"
version = "0.1.0"
description = "MCP server that fetches Swedish restaurant lunch guides"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
]

[project.scripts]
mcp-lunch = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "basedpyright>=1.0",
    "mypy>=1.0",
    "ruff>=0.15.16",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "S", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*", "mcp.*", "uvicorn", "starlette.*", "psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
