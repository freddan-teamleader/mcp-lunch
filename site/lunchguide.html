<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Lunchguide · teamleader/se</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Dagens lunchmenyer i svenska städer — hämtat live via MCP.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0e0d;
  --surface:#1a1917;
  --surface-alt:#222120;
  --border:#2e2c2a;
  --accent:#c9a96e;
  --accent-muted:#8a7250;
  --text-primary:#f0ece6;
  --text-muted:#8a8480;
  --tag-bg:#2a2724;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --head-h:64px;
  --page:1180px;
}
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,p,ul,ol,li,figure{margin:0;padding:0}
ul{list-style:none}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--text-muted)}
.shell{width:100%;max-width:var(--page);margin:0 auto;padding:0 32px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

/* ── header ─────────────────────────────────────────────── */
.site-head{
  position:fixed;top:0;left:0;right:0;z-index:50;height:var(--head-h);
  display:flex;align-items:center;
  background:transparent;border-bottom:1px solid transparent;
  transition:background .25s ease,border-color .25s ease,backdrop-filter .25s ease;
}
.site-head.solid{
  background:rgba(15,14,13,.86);
  border-bottom-color:var(--border);
  backdrop-filter:saturate(140%) blur(10px);
}
.site-head .shell{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:13px;letter-spacing:.02em;
  color:var(--text-primary);text-decoration:none;
}
.brand b{font-weight:500}
.brand .sep{color:var(--accent)}
.brand i{font-style:normal;color:var(--text-muted)}
.brand-mark{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.back{text-decoration:none;transition:color .2s ease;white-space:nowrap}
.back:hover{color:var(--accent)}

/* ── hero ───────────────────────────────────────────────── */
main{flex:1;padding-top:var(--head-h)}
.hero{padding:76px 0 8px}
.eyebrow{display:block;margin-bottom:22px}
.eyebrow .dot{color:var(--accent)}
h1{
  font-family:var(--serif);font-weight:900;
  font-size:clamp(44px,7.4vw,88px);line-height:.98;letter-spacing:-.02em;
  max-width:14ch;
}
h1 .city{color:var(--accent);display:inline-block}
h1 .city.swap{animation:citySwap .32s ease both}
@keyframes citySwap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── city picker ────────────────────────────────────────── */
.picker{margin-top:46px;border-top:1px solid var(--border);padding-top:18px}
.picker-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.picker-tools{display:flex;align-items:center;gap:16px}
.near-btn{
  flex:none;cursor:pointer;background:transparent;border:1px solid var(--border);border-radius:999px;
  color:var(--text-muted);padding:6px 13px;
  transition:color .2s ease,border-color .2s ease,background .2s ease;
}
.near-btn:hover:not(:disabled){color:var(--accent);border-color:var(--accent-muted);background:var(--surface)}
.near-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:rgba(201,169,110,.07)}
.near-btn:disabled{opacity:.55;cursor:progress}
.city-filter{
  width:190px;background:transparent;border:0;border-bottom:1px solid var(--border);
  color:var(--text-primary);font-family:var(--mono);font-size:12px;padding:6px 2px;
  transition:border-color .2s ease;
}
.city-filter::placeholder{color:var(--text-muted)}
.city-filter:focus{outline:0;border-bottom-color:var(--accent)}
.pills{
  display:flex;gap:8px;overflow-x:auto;overflow-anchor:none;padding:4px 2px 14px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  -webkit-overflow-scrolling:touch;
}
.pills::-webkit-scrollbar{height:4px}
.pills::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.pill{
  /* Keep the browser's scroll anchoring from nudging the strip sideways when
     the card grid is inserted below it. */
  overflow-anchor:none;
  flex:none;cursor:pointer;white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  color:var(--text-muted);font-family:var(--sans);font-size:13px;font-weight:500;
  padding:7px 15px;transition:color .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.pill:hover{color:var(--text-primary);border-color:var(--accent-muted);background:var(--surface-alt)}
.pill[aria-pressed="true"]{
  color:var(--accent);border-color:var(--accent);background:rgba(201,169,110,.07);
  box-shadow:0 0 0 3px rgba(201,169,110,.08);
}

/* ── results ────────────────────────────────────────────── */
.results{padding:26px 0 96px}
.result-meta{display:flex;align-items:baseline;gap:10px;min-height:18px;margin-bottom:24px}
.result-meta b{color:var(--text-primary);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:22px 22px 20px;
  transition:border-color .15s ease,transform .15s ease,background .15s ease;
}
.card.enter{animation:cardIn .42s cubic-bezier(.22,.7,.3,1) both;animation-delay:calc(var(--i) * 50ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card:hover{border-color:var(--accent-muted);background:var(--surface-alt);transform:translateY(-2px)}
.card.is-closed{opacity:.62}

.card-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.logo,.logo-ph{width:42px;height:42px;border-radius:50%;flex:none}
.logo{object-fit:cover;background:var(--surface-alt)}
.logo-ph{
  display:grid;place-items:center;background:var(--tag-bg);
  border:1px solid var(--border);color:var(--accent);
  font-family:var(--serif);font-weight:700;font-size:17px;line-height:1;
}
.card-name{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.01em}
.card-sub{display:block;margin-top:4px}

.dishes{border-top:1px solid var(--border)}
.dish{padding:11px 0;border-bottom:1px solid var(--border)}
.dish:last-child{border-bottom:0;padding-bottom:0}
.dish-row{display:flex;align-items:baseline;gap:8px}
.dish-name{font-size:14.5px;line-height:1.45}
.leader{flex:1;min-width:14px;border-bottom:1px dotted var(--border);transform:translateY(-3px)}
.price{flex:none;font-family:var(--mono);font-size:12.5px;color:var(--accent);white-space:nowrap}
.dish-label{margin-bottom:3px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-muted)}
.dish-desc{margin-top:3px;font-size:13px;line-height:1.5;color:var(--text-muted)}
.note{font-size:13.5px;line-height:1.55;color:var(--text-muted);padding:11px 0 0}
.note.closed{color:var(--text-primary)}
.note.closed::before{content:"● ";color:var(--accent-muted);font-size:10px;vertical-align:middle}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{
  background:var(--tag-bg);border:1px solid var(--border);border-radius:4px;
  color:var(--text-muted);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  padding:2px 7px;
}
.more{
  margin-top:14px;background:transparent;border:0;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--accent-muted);
  transition:color .2s ease;
}
.more:hover{color:var(--accent)}

/* ── skeleton ───────────────────────────────────────────── */
.sk{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
.sk-line{background:var(--surface-alt);border-radius:4px;position:relative;overflow:hidden}
.sk-line::after{
  content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(240,236,230,.055),transparent);
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sk-head{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.sk-avatar{width:42px;height:42px;border-radius:50%;flex:none}
.sk-rows{display:flex;flex-direction:column;gap:11px}

/* ── states ─────────────────────────────────────────────── */
.state{padding:56px 0;font-family:var(--mono);font-size:13px;color:var(--text-muted);line-height:1.9}
.state .retry{
  background:transparent;border:0;padding:0;margin-left:6px;cursor:pointer;
  font:inherit;color:var(--accent);text-decoration:underline;text-underline-offset:3px;
}

/* ── footer ─────────────────────────────────────────────── */
.site-foot{border-top:1px solid var(--border);padding:22px 0 30px}
.site-foot .shell{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ── responsive ─────────────────────────────────────────── */
@media (max-width:1024px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .shell{padding:0 20px}
  .hero{padding:52px 0 4px}
  h1{max-width:none}
  .grid{grid-template-columns:1fr}
  .picker-head{flex-direction:column;align-items:flex-start;gap:10px}
  .picker-tools{width:100%;gap:12px}
  .city-filter{flex:1;width:auto;min-width:0}
  .back{font-size:11px}
  .back-long{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card:hover{transform:none}
}
</style>
</head>
<body>

<header class="site-head" id="siteHead">
  <div class="shell">
    <a class="brand" href="/">
      <span class="brand-mark"></span><b>teamleader</b><span class="sep">/</span><i>se</i>
    </a>
    <a class="back mono" href="/">←<span class="back-long"> tillbaka till</span> teamleader.se</a>
  </div>
</header>

<main>
  <div class="shell">

    <section class="hero">
      <p class="eyebrow mono" id="eyebrow">// dagens lunch</p>
      <h1>Vad äter <span class="city" id="heroCity">Kalmar</span><br>idag?</h1>

      <div class="picker">
        <div class="picker-head">
          <span class="mono">// välj stad</span>
          <div class="picker-tools">
            <button class="near-btn mono" id="nearBtn" type="button">◎ nära mig</button>
            <input class="city-filter" id="cityFilter" type="search" placeholder="sök stad…" aria-label="Sök stad" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <div class="pills" id="cityPills" role="group" aria-label="Städer"></div>
      </div>
    </section>

    <section class="results">
      <p class="result-meta mono" id="resultMeta" aria-live="polite"></p>
      <div id="view"></div>
    </section>

  </div>
</main>

<footer class="site-foot">
  <div class="shell">
    <span class="mono">© 2026 teamleader.se · Stockholm · Sweden</span>
    <span class="mono">// powered by mcp · lunchguide.mcp</span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var ENDPOINT = "/lunchguide/mcp";
  var DEFAULT_CITY = "kalmar";
  var NEAR_RADIUS_KM = 2;
  var PREVIEW_DISHES = 5;

  var el = {
    head: document.getElementById("siteHead"),
    eyebrow: document.getElementById("eyebrow"),
    heroCity: document.getElementById("heroCity"),
    pills: document.getElementById("cityPills"),
    filter: document.getElementById("cityFilter"),
    near: document.getElementById("nearBtn"),
    meta: document.getElementById("resultMeta"),
    view: document.getElementById("view")
  };

  if ("scrollRestoration" in history) history.scrollRestoration = "manual";

  var cities = {};          // slug -> display name
  var current = null;       // active city slug
  var reqToken = 0;         // guards against out-of-order responses

  /* ── MCP (stateless streamable HTTP — no initialize handshake needed) ── */

  function callTool(name, args) {
    return fetch(ENDPOINT, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json, text/event-stream"
      },
      body: JSON.stringify({
        jsonrpc: "2.0",
        id: Date.now(),
        method: "tools/call",
        params: { name: name, arguments: args || {} }
      })
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(function (body) {
      var msg = parseEnvelope(body);
      if (!msg || msg.error) throw new Error(msg && msg.error ? msg.error.message : "Tomt svar");
      var content = msg.result && msg.result.content;
      var text = content && content[0] && content[0].text;
      if (!text) throw new Error("Tomt innehåll");
      return JSON.parse(text);
    });
  }

  // The server answers either as plain JSON-RPC or as an SSE frame.
  function parseEnvelope(body) {
    var trimmed = body.replace(/^﻿/, "").trim();
    if (trimmed.charAt(0) === "{") {
      try { return JSON.parse(trimmed); } catch (e) { /* fall through to SSE */ }
    }
    var lines = trimmed.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf("data:") !== 0) continue;
      try {
        var payload = JSON.parse(lines[i].slice(5));
        if (payload.result || payload.error) return payload;
      } catch (e) { /* keep scanning */ }
    }
    return null;
  }

  /* ── cache: one entry per city + date, dropped when the day rolls over ── */

  function today() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function cacheKey(slug) { return "lg:" + slug + ":" + today(); }

  function cacheRead(slug) {
    try {
      var raw = sessionStorage.getItem(cacheKey(slug));
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function cacheWrite(slug, data) {
    try {
      sessionStorage.setItem(cacheKey(slug), JSON.stringify(data));
    } catch (e) { /* private mode / quota — cache is optional */ }
  }

  /* ── helpers ── */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function logoSrc(logo) {
    if (!logo) return "";
    if (/^https?:\/\//i.test(logo)) return logo;
    if (logo.charAt(0) === "/") return "/lunchguide/image-proxy?path=" + encodeURIComponent(logo);
    return "";
  }

  function monogram(name) {
    var words = String(name).trim().split(/\s+/).filter(Boolean);
    if (!words.length) return "?";
    var first = words[0].charAt(0);
    var second = words.length > 1 ? words[1].charAt(0) : "";
    return (first + second).toUpperCase();
  }

  // Lines with no price that follow a priced dish are the dish's description —
  // fold them in (carrying their diet tags up) so a card reads as real dishes.
  function foldDishes(raw) {
    var out = [];
    var pendingLabel = "";
    (raw || []).forEach(function (d, idx) {
      var prev = out[out.length - 1];
      var next = raw[idx + 1];

      // A short unpriced line right before a priced dish is a label the site
      // stamps on the dish ("Nyhet", "Dagens"), not a dish of its own.
      var isLabel = d.price == null && !d.closed && d.name.length <= 20 &&
        next && next.price != null && (!prev || prev.price != null);
      if (isLabel) {
        pendingLabel = d.name;
        return;
      }

      var isDescription = d.price == null && !d.closed && prev && prev.price != null;
      if (isDescription) {
        prev.desc.push(d.name);
        prev.vegetarian = prev.vegetarian || !!d.vegetarian;
        (d.tags || []).forEach(function (t) {
          if (prev.tags.indexOf(t) === -1) prev.tags.push(t);
        });
        return;
      }
      out.push({
        name: d.name,
        label: pendingLabel,
        price: d.price,
        closed: !!d.closed,
        vegetarian: !!d.vegetarian,
        tags: (d.tags || []).slice(),
        desc: []
      });
      pendingLabel = "";
    });
    return out;
  }

  // A restaurant with no priced dish at all is a status message, not a menu.
  // Its lines arrive fragmented, so glue them back into one sentence.
  function statusLine(dishes) {
    var text = dishes.map(function (d) { return d.name; }).join(" ").replace(/\s+/g, " ").trim();
    var lower = text.toLowerCase();
    if (!text) return { text: "Ingen meny publicerad idag.", closed: false };
    if (lower.indexOf("stängt") !== -1) return { text: "Lunchstängt idag.", closed: true };
    if (lower.indexOf("har inte lagt upp") !== -1) return { text: "Ingen meny publicerad idag.", closed: false };
    // The last restaurant on a scraped page can absorb the page's own footer.
    // Anything this long is never a menu note — don't put it on a card.
    if (text.length > 160) return { text: "Ingen meny publicerad idag.", closed: false };
    return { text: text, closed: false };
  }

  /* ── rendering ── */

  function renderCard(r, index) {
    var dishes = foldDishes(r.dishes);
    var priced = dishes.filter(function (d) { return d.price != null; });
    var closedFlag = dishes.length > 0 && dishes.every(function (d) { return d.closed; });

    var src = logoSrc(r.logo);
    var head =
      (src
        ? '<img class="logo" src="' + esc(src) + '" alt="" loading="lazy" ' +
          'onerror="this.outerHTML=\'<span class=&quot;logo-ph&quot; aria-hidden=&quot;true&quot;>' +
          esc(monogram(r.name)) + '</span>\'">'
        : '<span class="logo-ph" aria-hidden="true">' + esc(monogram(r.name)) + "</span>") +
      '<div><h2 class="card-name">' + esc(r.name) + "</h2>" +
      cardSub(r, priced, closedFlag) + "</div>";

    var body;
    if (closedFlag) {
      body = '<p class="note closed">' + esc(dishes[0].name || "Stängt idag") + "</p>";
    } else if (!priced.length) {
      var status = statusLine(dishes);
      body = '<p class="note' + (status.closed ? " closed" : "") + '">' + esc(status.text) + "</p>";
    } else {
      body = dishList(dishes);
    }

    var card = document.createElement("article");
    card.className = "card enter" + (closedFlag || !priced.length ? " is-closed" : "");
    card.style.setProperty("--i", Math.min(index, 11));
    card.innerHTML = '<div class="card-head">' + head + "</div>" + body;
    return card;
  }

  function cardSub(r, priced, closedFlag) {
    var bits = [];
    if (r.distance_km != null) bits.push(formatDistance(r.distance_km));
    if (priced.length && !closedFlag) bits.push(subtitle(priced));
    if (!bits.length) return "";
    return '<span class="card-sub mono">' + esc(bits.join(" · ")) + "</span>";
  }

  function formatDistance(km) {
    return km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(1).replace(".", ",") + " km";
  }

  function subtitle(priced) {
    var min = priced.reduce(function (acc, d) { return Math.min(acc, d.price); }, Infinity);
    var count = priced.length + (priced.length === 1 ? " rätt" : " rätter");
    return count + " · från " + min + " kr";
  }

  function dishList(dishes) {
    var visible = dishes.slice(0, PREVIEW_DISHES);
    var hidden = dishes.slice(PREVIEW_DISHES);
    var html = '<ul class="dishes">' + visible.map(dishRow).join("") + "</ul>";
    if (hidden.length) {
      html += '<ul class="dishes" hidden>' + hidden.map(dishRow).join("") + "</ul>" +
        '<button class="more" type="button">+ visa ' + hidden.length + " till</button>";
    }
    return html;
  }

  function dishRow(d) {
    var tags = d.tags.length
      ? '<div class="tags">' + d.tags.map(function (t) {
          return '<span class="tag">' + esc(t) + "</span>";
        }).join("") + "</div>"
      : "";
    return '<li class="dish">' +
      (d.label ? '<p class="dish-label mono">' + esc(d.label) + "</p>" : "") +
      '<div class="dish-row">' +
        '<span class="dish-name">' + esc(d.name) + "</span>" +
        '<span class="leader" aria-hidden="true"></span>' +
        (d.price != null ? '<span class="price">' + d.price + " kr</span>" : "") +
      "</div>" +
      (d.desc.length ? '<p class="dish-desc">' + esc(d.desc.join(" ")) + "</p>" : "") +
      tags +
      "</li>";
  }

  function renderList(restaurants, cityName, near) {
    el.view.innerHTML = "";
    if (!restaurants.length) {
      showState(near
        ? "// inga luncher inom " + NEAR_RADIUS_KM + " km från din position"
        : "// inga luncher hittades för " + cityName.toLowerCase() + " idag");
      return;
    }
    var open = restaurants.filter(function (r) {
      return (r.dishes || []).some(function (d) { return d.price != null; });
    }).length;
    el.meta.innerHTML = (near ? "inom <b>" + NEAR_RADIUS_KM + " km</b> · " : "") +
      "<b>" + restaurants.length + "</b> restauranger · <b>" + open + "</b> med publicerad meny";

    var grid = document.createElement("div");
    grid.className = "grid";
    restaurants.forEach(function (r, i) { grid.appendChild(renderCard(r, i)); });
    el.view.appendChild(grid);
  }

  function showSkeleton() {
    el.meta.textContent = "// hämtar dagens lunch…";
    var rows = "";
    for (var r = 0; r < 4; r++) {
      rows += '<div class="sk-line" style="height:13px;width:' + (95 - r * 11) + '%"></div>';
    }
    var cards = "";
    for (var i = 0; i < 6; i++) {
      cards +=
        '<div class="sk">' +
          '<div class="sk-head">' +
            '<div class="sk-line sk-avatar"></div>' +
            '<div style="flex:1"><div class="sk-line" style="height:17px;width:58%"></div></div>' +
          "</div>" +
          '<div class="sk-rows">' + rows + "</div>" +
        "</div>";
    }
    el.view.innerHTML = '<div class="grid">' + cards + "</div>";
  }

  function showState(text, retry) {
    el.meta.textContent = "";
    el.view.innerHTML = '<p class="state">' + esc(text) +
      (retry ? '<button class="retry" type="button">försök igen</button>' : "") + "</p>";
    if (retry) {
      el.view.querySelector(".retry").addEventListener("click", function () {
        selectCity(current, { force: true });
      });
    }
  }

  /* ── city picker ── */

  function buildPills() {
    var frag = document.createDocumentFragment();
    Object.keys(cities).sort(function (a, b) {
      if (a === DEFAULT_CITY) return -1;
      if (b === DEFAULT_CITY) return 1;
      return cities[a].localeCompare(cities[b], "sv");
    }).forEach(function (slug) {
      var btn = document.createElement("button");
      btn.className = "pill";
      btn.type = "button";
      btn.textContent = cities[slug];
      btn.dataset.slug = slug;
      btn.setAttribute("aria-pressed", "false");
      btn.addEventListener("click", function () { selectCity(slug); });
      frag.appendChild(btn);
    });
    el.pills.innerHTML = "";
    el.pills.appendChild(frag);
  }

  var aligned = false;
  var alignTries = 0;

  function markActive(slug) {
    var active = null;
    Array.prototype.forEach.call(el.pills.children, function (btn) {
      var on = btn.dataset.slug === slug;
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      if (on) active = btn;
    });
    // Scroll the strip itself rather than using scrollIntoView, which would
    // also scroll the page and knock the hero out of view on load.
    if (active) {
      var strip = el.pills.getBoundingClientRect();
      var pill = active.getBoundingClientRect();
      // Until layout settles the strip can measure narrower than a single pill,
      // and the centring maths would then shove it half a pill sideways. Wait
      // for a frame that reports a real width instead.
      if (strip.width < pill.width) {
        if (alignTries++ < 30) requestAnimationFrame(function () { markActive(slug); });
        return;
      }
      alignTries = 0;
      var delta = (pill.left - strip.left) - (strip.width - pill.width) / 2;
      // The very first alignment happens while the grid is still being built;
      // a smooth scroll can get dropped in that churn, so snap it into place.
      el.pills.scrollTo({
        left: Math.max(0, el.pills.scrollLeft + delta),
        behavior: aligned ? "smooth" : "auto"
      });
      aligned = true;
    }
  }

  function filterPills(query) {
    var q = query.trim().toLowerCase();
    Array.prototype.forEach.call(el.pills.children, function (btn) {
      var name = cities[btn.dataset.slug].toLowerCase();
      btn.hidden = q !== "" && name.indexOf(q) === -1 && btn.dataset.slug.indexOf(q) === -1;
    });
  }

  function setHero(cityName) {
    el.heroCity.textContent = cityName;
    el.heroCity.classList.remove("swap");
    void el.heroCity.offsetWidth;
    el.heroCity.classList.add("swap");

    var date = new Date().toLocaleDateString("sv-SE", {
      weekday: "long", day: "numeric", month: "long"
    });
    el.eyebrow.innerHTML = '// dagens lunch <span class="dot">·</span> ' + esc(date) +
      ' <span class="dot">·</span> ' + esc(cityName.toLowerCase());
  }

  function selectCity(slug, opts) {
    if (!slug || !cities[slug]) return;
    var force = opts && opts.force;
    var name = cities[slug];
    setNearActive(false);
    current = slug;
    markActive(slug);
    setHero(name);

    var url = slug === DEFAULT_CITY ? location.pathname : location.pathname + "?stad=" + slug;
    history.replaceState(null, "", url);

    var cached = force ? null : cacheRead(slug);
    if (cached) { renderList(cached, name); return; }

    var token = ++reqToken;
    showSkeleton();
    callTool("get_lunch_guide", { city: slug }).then(function (data) {
      if (token !== reqToken) return;
      var list = Array.isArray(data) ? data : (data.restaurants || []);
      cacheWrite(slug, list);
      renderList(list, name);
    }).catch(function (err) {
      if (token !== reqToken) return;
      console.error(err);
      showState("// kunde inte hämta luncher för " + name.toLowerCase() + " — ", true);
    });
  }

  /* ── "nära mig": position → city → get_lunch_near ── */

  function setNearBusy(busy) {
    el.near.disabled = busy;
    el.near.textContent = busy ? "◎ söker…" : "◎ nära mig";
  }

  function setNearActive(on) {
    el.near.setAttribute("aria-pressed", on ? "true" : "false");
  }

  // "Göteborgs kommun" → "goteborg", so it can be matched against a city slug.
  function normalise(name) {
    return String(name).toLowerCase()
      .replace(/\s+(kommun|municipality|tätort)$/, "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function matchCity(name) {
    var key = normalise(name);
    if (cities[key]) return key;
    var slugs = Object.keys(cities);
    for (var i = 0; i < slugs.length; i++) {
      if (normalise(cities[slugs[i]]) === key) return slugs[i];
    }
    return null;
  }

  function reverseGeocode(lat, lon) {
    var url = "https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&lat=" +
      encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lon);
    return fetch(url, { headers: { "Accept": "application/json" } })
      .then(function (r) { return r.json(); })
      .then(function (geo) {
        var a = geo && geo.address;
        if (!a) return null;
        return a.city || a.town || a.village || a.municipality || a.county || null;
      });
  }

  function loadNear(slug, lat, lon) {
    var name = cities[slug];
    var token = ++reqToken;
    current = slug;
    markActive(slug);
    setNearActive(true);
    setHero(name);
    history.replaceState(null, "", location.pathname + "?stad=" + slug + "&nara=1");
    showSkeleton();

    // Position-dependent, so deliberately not written to the per-city cache.
    callTool("get_lunch_near", { city: slug, lat: lat, lon: lon, radius_km: NEAR_RADIUS_KM })
      .then(function (data) {
        if (token !== reqToken) return;
        setNearBusy(false);
        renderList(Array.isArray(data) ? data : (data.restaurants || []), name, true);
      })
      .catch(function (err) {
        if (token !== reqToken) return;
        setNearBusy(false);
        console.error(err);
        showState("// kunde inte hämta luncher nära dig — ", true);
      });
  }

  function locate() {
    if (!navigator.geolocation) {
      showState("// din webbläsare stödjer inte platsdelning");
      return;
    }
    setNearBusy(true);
    navigator.geolocation.getCurrentPosition(function (pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      reverseGeocode(lat, lon).then(function (place) {
        var slug = place && matchCity(place);
        if (!slug) {
          setNearBusy(false);
          setNearActive(false);
          showState(place
            ? "// vi har ingen lunchguide för " + place.toLowerCase() + " än"
            : "// kunde inte avgöra vilken stad du är i");
          return;
        }
        loadNear(slug, lat, lon);
      }).catch(function (err) {
        setNearBusy(false);
        setNearActive(false);
        console.error(err);
        showState("// kunde inte avgöra vilken stad du är i");
      });
    }, function (err) {
      setNearBusy(false);
      setNearActive(false);
      showState(err && err.code === 1
        ? "// platsdelning nekad — välj en stad ovan istället"
        : "// kunde inte hämta din position");
    }, { timeout: 10000, maximumAge: 300000 });
  }

  /* ── wiring ── */

  el.near.addEventListener("click", function () {
    if (el.near.getAttribute("aria-pressed") === "true") {
      selectCity(current, { force: true });   // leave near-mode
      return;
    }
    locate();
  });

  el.filter.addEventListener("input", function () { filterPills(this.value); });

  el.view.addEventListener("click", function (ev) {
    var btn = ev.target.closest && ev.target.closest(".more");
    if (!btn) return;
    var hiddenList = btn.previousElementSibling;
    hiddenList.hidden = false;
    btn.remove();
  });

  // Pill widths shift when the webfonts swap in; realign once they settle.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (current) markActive(current); });
  }

  var onScroll = function () {
    el.head.classList.toggle("solid", window.scrollY > 12);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  function startCity() {
    var wanted = new URLSearchParams(location.search).get("stad");
    return wanted && cities[wanted] ? wanted : (cities[DEFAULT_CITY] ? DEFAULT_CITY : Object.keys(cities)[0]);
  }

  setHero(DEFAULT_CITY.charAt(0).toUpperCase() + DEFAULT_CITY.slice(1));
  showSkeleton();

  callTool("list_cities", {}).then(function (data) {
    cities = data || {};
    buildPills();
    selectCity(startCity(), { force: true });
  }).catch(function (err) {
    console.error(err);
    showState("// kunde inte ladda städer — ", false);
  });
})();
</script>
</body>
</html>
